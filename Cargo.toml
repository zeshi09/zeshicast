[package]
name = "zeshicast"
version = "0.1.0"
edition = "2024"
# MSRV of the default (CLI) build: edition 2024 needs >= 1.85, let-chains
# (used in a few `if let … && …` guards) need >= 1.88, and the dependency
# floor is 1.86 (icu_* via idna/url). Measured/derived with `cargo metadata`
# plus a feature audit.
# NOTE: the optional `desktop` feature (gio/glib 0.22) and `gui` (gtk4 0.11)
# raise the requirement to 1.92.
rust-version = "1.88"
publish = false

[features]
default = []
# Desktop services: gio/glib D-Bus (MPRIS, NetworkManager), JSON commands and
# script stdout capture. This is everything a headless build needs to do real
# work; `gui` adds only the widgets on top (P5.1).
desktop = ["dep:gio", "dep:glib"]
gui = ["desktop", "dep:gtk"]
layer-shell = ["gui"]

[dependencies]
# Logging facade (P4.4): the daemon is a systemd service, so it needs
# levels and a filter instead of bare prints. The subscriber lives in
# src/logging.rs and reads RUST_LOG.
log = "0.4"
chrono = "0.4.44"
flate2 = "1.1"
gio = { version = "0.22", optional = true }
glib = { version = "0.22", optional = true }
gtk = { package = "gtk4", version = "0.11.3", optional = true, features = ["v4_6"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tar = "0.4"
tempfile = "3.18"
toml = "1.1.2"
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "zeshicast"
path = "src/main.rs"

[[bin]]
name = "zeshicast-gtk"
path = "src/bin/zeshicast-gtk.rs"
required-features = ["gui"]
