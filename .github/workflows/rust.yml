name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

# Least privilege: every job here only reads the repository (zizmor:
# excessive-permissions).
permissions:
  contents: read

jobs:
  rust:
    name: Rust / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fmt
            command: cargo fmt --check
          - name: check
            command: cargo check
          - name: test
            command: cargo test

    steps:
      # Actions are pinned to a full commit SHA (zizmor: unpinned-uses) so a
      # re-pointed tag cannot inject code into CI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # zizmor: artipacked
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  nix:
    name: Nix / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: flake-check
            command: nix flake check
          - name: package-build
            command: nix build
          - name: gui-check
            command: nix develop --command cargo check --features gui,layer-shell
          - name: gui-test
            command: nix develop --command cargo test --features gui,layer-shell
          - name: gui-clippy
            command: nix develop --command cargo clippy --all-targets --features gui,layer-shell -- -D warnings
          - name: layer-shell-check
            command: nix develop --command cargo check --features gui,layer-shell
          # `desktop` without `gui`: the headless build with the D-Bus services.
          # Its tests are the ones the other legs skip (mpris, NetworkManager).
          - name: desktop-test
            command: nix develop --command cargo test --features desktop
          - name: desktop-clippy
            command: nix develop --command cargo clippy --all-targets --features desktop -- -D warnings

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources
          arguments: --all-features
